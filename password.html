<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0,
                   viewport-fit=cover">

    <title>Dada - Password</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <main class="index-page">

        <section class="login-section">

            <div class="login-box">

                <h1>Password</h1>


                <input type="text" id="pwdInput" placeholder="type here" autocomplete="off">

                <button id="passwdNextBtn">
                    Next
                </button>

            </div>

        </section>

    </main>
    <script>
        const pwdInput = document.getElementById("pwdInput");
        const pwdNextBtn = document.getElementById("passwdNextBtn");


        pwdNextBtn.addEventListener("click", function () {
            const password = pwdInput.value.trim();

            if (password === "P@55w0rdCX") {

                window.location.href = "admin-view.html";

            } else {

                window.location.href = "index.html";

            }

        });

        pwdInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                pwdNextBtn.click();
            }

        });
    </script>
</body>

</html>
