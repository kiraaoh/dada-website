<head>
    <meta charset="UTF-8">
    <!-- Crucial tag to tell mobile browsers not to shrink the page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Message</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0e6f2;
            font-family: 'Playfair Display', Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 30px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            /* Fills mobile nicely while staying centered on desktop */
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: left;
            width: 100%;
        }

        .to-field {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .msg-body {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 24px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .from-field {
            font-size: 16px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 4px;
        }

        .date-field {
            font-size: 12px;
            color: #777;
            text-align: right;
        }

        .back-btn {
            display: inline-block;
            margin-top: 24px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello Admin</h1>

        <div class="card">
            <div class="to-field">To : <span id="recipient"></span></div>
            <div class="msg-body" id="message-text"></div>
            <div class="from-field">From: <span id="sender"></span></div>
            <div class="date-field" id="timestamp"></div>
        </div>

        <a href="admin-view.html" class="back-btn">← Back to all messages</a>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem("selectedMessage"));

        if (data) {
            document.getElementById("recipient").textContent = data.me || "(who am i to u)";
            document.getElementById("message-text").textContent = data.message;
            document.getElementById("sender").textContent = data.name;

            // Safe timestamp handler
            if (data.timestamp) {
                const d = new Date(data.timestamp);
                // If valid date object/ISO string, format nicely. Otherwise, display raw value.
                document.getElementById("timestamp").textContent = !isNaN(d.getTime())
                    ? d.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
                    : data.timestamp;
            } else {
                document.getElementById("timestamp").textContent = "";
            }
        } else {
            window.location.href = "view.html";
        }
    </script>
</body>

</html>
